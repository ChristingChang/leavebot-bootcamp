[project]
name = "leavebot"
version = "0.2.0"
description = "LeaveBot 上課 repo：工具包（kit）與驗收工具。app 由學員在 backend/ 從 0 生成"
requires-python = ">=3.11"
# 這份清單就是後端的套件白名單（見 STACK.md）。要加套件，先問、再改這裡。
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "anthropic>=1.0",
    "httpx>=0.27",   # FastAPI TestClient 需要
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["kit"]

[tool.pytest.ini_options]
# backend/tests 是你在 D2 寫的測試；還沒建立時 pytest 會略過它
testpaths = ["kit/tests", "scripts/tests", "backend/tests"]
pythonpath = ["backend", "."]
# 測試資料夾不用放 __init__.py；不同層級有同名測試檔也不會撞名
addopts = "--import-mode=importlib"
markers = [
    "req(*ids): 這個測試實作哪個測試案例（TC-xx）、驗哪條需求（AC / FR / NFR）。scripts/trace.py 會讀它",
]
